name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# ┌─ go-test (unit, 3 OS) ─┐
# ├─ go-integration (Db2) ─┼─> wheels ─> old-glibc ─> publish (PyPI) / github-release
# ├─ validation (Db2) ─────┤
# └─ python-test (Db2 + Hardcharger)
#
# Db2 only ships as a linux/amd64 container, so integration jobs run on
# ubuntu; macOS/Windows run the hermetic unit tests and build wheels.
#
# Every job builds the c-shared library through scripts/build_lib.sh, which
# limits its exports to Adbc* (plus the deprecated Db2DriverInit alias), and
# then checks them with scripts/checkexports (ADBC shared-library
# requirements). Linux release builds use zig cc against glibc 2.17, the
# floor the wheels' manylinux2014 tag promises.

env:
  GO_VERSION: '1.27.3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  go-test:
    name: Go unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...

  go-integration:
    name: Go integration + ADBC conformance (Db2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Start Db2
        run: |
          # Registry hiccups (icr.io especially) fail a bare docker run;
          # pull with retries first.
          for img in icr.io/db2_community/db2; do
            for i in 1 2 3 4 5; do docker pull "$img" && break; [ $i = 5 ] && exit 1; sleep $((i * 15)); done
          done
          docker run -d --name db2 --privileged=true -p 50000:50000 \
            -e LICENSE=accept -e DB2INST1_PASSWORD=password -e DBNAME=testdb \
            icr.io/db2_community/db2
      - name: Build driver (while Db2 initialises)
        run: go build ./... && go test -c -o /dev/null ./driver/db2
      - name: Wait for Db2
        timeout-minutes: 15
        run: |
          for i in $(seq 1 180); do
            if docker logs db2 2>&1 | grep -q "Setup has completed"; then exit 0; fi
            sleep 5
          done
          docker logs db2 | tail -50; exit 1
      - name: Go integration tests
        env:
          DB2_HOST: localhost
          DB2_PORT: '50000'
        run: go test -timeout 20m -count=1 ./...

  validation:
    # The adbc-drivers.org conformance suite (validation/), run against a real
    # Db2 with this commit's c-shared library. It is a release gate: it fails,
    # never skips, when the server or the library is missing.
    name: ADBC conformance suite (adbc-drivers.org, Db2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # setup-uv publishes no floating major tags; pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Start Db2
        run: |
          # Registry hiccups (icr.io especially) fail a bare docker run;
          # pull with retries first.
          for i in 1 2 3 4 5; do docker pull icr.io/db2_community/db2 && break; [ $i = 5 ] && exit 1; sleep $((i * 15)); done
          docker run -d --name db2 --privileged=true -p 50000:50000 \
            -e LICENSE=accept -e DB2INST1_PASSWORD=password -e DBNAME=testdb \
            icr.io/db2_community/db2
      - name: Build c-shared driver library
        run: |
          scripts/build_lib.sh pkg/db2/libadbc_driver_db2.so
          go run ./scripts/checkexports -allow Db2DriverInit pkg/db2/libadbc_driver_db2.so
      - name: Install the validation suite
        run: |
          uv venv --python 3.14 validation/.venv
          uv pip install --python validation/.venv/bin/python -r validation/requirements.txt
      - name: Wait for Db2
        timeout-minutes: 15
        run: |
          for i in $(seq 1 180); do
            if docker logs db2 2>&1 | grep -q "Setup has completed"; then exit 0; fi
            sleep 5
          done
          docker logs db2 | tail -50; exit 1
      - name: Run the validation suite
        working-directory: validation
        env:
          ADBC_DB2_TEST_URI: db2://db2inst1:password@127.0.0.1:50000/testdb
          ADBC_DB2_TEST_DRIVER_PATH: ${{ github.workspace }}/pkg/db2/libadbc_driver_db2.so
        run: .venv/bin/pytest -ra --junitxml=validation-results.xml tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-results
          path: validation/validation-results.xml

  python-test:
    name: Python tests (Db2 + Hardcharger, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Start Db2
        run: |
          # Registry hiccups (icr.io especially) fail a bare docker run;
          # pull with retries first.
          for i in 1 2 3 4 5; do docker pull icr.io/db2_community/db2 && break; [ $i = 5 ] && exit 1; sleep $((i * 15)); done
          docker run -d --name db2 --privileged=true -p 50000:50000 \
            -e LICENSE=accept -e DB2INST1_PASSWORD=password -e DBNAME=testdb \
            icr.io/db2_community/db2
      - name: Build c-shared driver library
        run: |
          scripts/build_lib.sh pkg/db2/libadbc_driver_db2.so
          go run ./scripts/checkexports -allow Db2DriverInit pkg/db2/libadbc_driver_db2.so
          echo "ADBC_DB2_LIBRARY=$PWD/pkg/db2/libadbc_driver_db2.so" >> "$GITHUB_ENV"
      - name: Start Hardcharger
        # The Db2 -> Hardcharger tests (test-only dependency; the driver itself has
        # no Hardcharger code). Not on Python 3.10, which the Hardcharger client
        # doesn't support. Started after the build so the server can load this
        # commit's driver library for the adbc_scanner tests; host networking lets
        # it reach Db2 on localhost:50000.
        if: matrix.python != '3.10'
        run: |
          for i in 1 2 3 4 5; do docker pull -q "$HARDCHARGER_IMAGE" && break; [ $i = 5 ] && exit 1; sleep $((i * 15)); done
          docker run -d --name hardcharger --network host \
            -v "$PWD/pkg/db2:/drivers:ro" \
            -e HARDCHARGER_ADMIN_USERNAME=hardcharger -e HARDCHARGER_ADMIN_PASSWORD=hardcharger \
            "$HARDCHARGER_IMAGE"
          docker run --rm "$HARDCHARGER_IMAGE" --version
          {
            echo "ADBC_DB2_TEST_HARDCHARGER_URI=hardcharger://127.0.0.1:31337?tls=false"
            echo "ADBC_DB2_TEST_HARDCHARGER_DRIVER_PATH=/drivers/libadbc_driver_db2.so"
          } >> "$GITHUB_ENV"
        env:
          HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:latest
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,hardcharger]"
      - name: Wait for Db2
        timeout-minutes: 15
        run: |
          for i in $(seq 1 180); do
            if docker logs db2 2>&1 | grep -q "Setup has completed"; then exit 0; fi
            sleep 5
          done
          docker logs db2 | tail -50; exit 1
      - name: Run pytest
        env:
          DB2_HOST: localhost
          DB2_PORT: '50000'
        run: pytest -v

  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.arch }}
    needs: [go-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64, runner: ubuntu-latest,    goos: linux,   goarch: amd64, ext: so }
          - { os: linux,   arch: arm64,  runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64, ext: so }
          - { os: macos,   arch: arm64,  runner: macos-latest,     goos: darwin,  goarch: arm64, ext: dylib }
          - { os: windows, arch: x86_64, runner: windows-latest,   goos: windows, goarch: amd64, ext: dll }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Linux: build with `zig cc` against glibc 2.17, so the wheel's
      # manylinux2014 tag (set in setup.py) is true. Built with the runner's
      # gcc, 0.2.4's library needed GLIBC_2.34.
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.goos == 'linux' }}
        with:
          version: 0.14.1
      - name: Build c-shared driver library
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          # Go 1.27's oldest supported macOS is 13.0, so the library and the
          # wheel say so. build_lib.sh also passes -mmacosx-version-min in
          # CGO_CFLAGS/CGO_LDFLAGS (Go's build cache ignores this variable).
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          if [ "${{ matrix.goos }}" = "linux" ]; then
            export CC="zig cc -target $([ "${{ matrix.goarch }}" = arm64 ] && echo aarch64 || echo x86_64)-linux-gnu.2.17"
          fi
          scripts/build_lib.sh "pkg/db2/libadbc_driver_db2.${{ matrix.ext }}"
          LIB="$PWD/pkg/db2/libadbc_driver_db2.${{ matrix.ext }}"
          if [ "${{ runner.os }}" = "Windows" ]; then LIB=$(cygpath -m "$LIB"); fi
          echo "ADBC_DB2_LIBRARY=$LIB" >> "$GITHUB_ENV"
      - name: Check the library's exports (ADBC shared-library requirements)
        shell: bash
        run: go run ./scripts/checkexports -allow Db2DriverInit "pkg/db2/libadbc_driver_db2.${{ matrix.ext }}"
      - name: Check the glibc ceiling (2.17, the manylinux2014 tag)
        if: ${{ matrix.goos == 'linux' }}
        run: |
          MAX=$(objdump -T pkg/db2/libadbc_driver_db2.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest glibc symbol version: ${MAX:-none}"
          if [ -z "$MAX" ]; then
            echo "::error::found no GLIBC_ symbol versions in libadbc_driver_db2.so"
            exit 1
          fi
          if [ "$(printf '%s\n2.17\n' "$MAX" | sort -V | tail -1)" != "2.17" ]; then
            echo "::error::libadbc_driver_db2.so needs glibc $MAX, but the wheel is tagged manylinux2014 (2.17)"
            exit 1
          fi
      - name: Check the macOS floor (13.0) and architecture
        if: ${{ matrix.goos == 'darwin' }}
        run: |
          otool -l pkg/db2/libadbc_driver_db2.dylib | grep -A4 LC_BUILD_VERSION
          MINOS=$(otool -l pkg/db2/libadbc_driver_db2.dylib | awk '/LC_BUILD_VERSION/ { f=1 } f && $1 == "minos" { print $2; exit }')
          ARCHS=$(lipo -archs pkg/db2/libadbc_driver_db2.dylib)
          echo "minos=$MINOS archs=$ARCHS"
          if [ "$MINOS" != "13.0" ] || [ "$ARCHS" != "arm64" ]; then
            echo "::error::expected minos 13.0 and arm64 only, got minos=$MINOS archs=$ARCHS"
            exit 1
          fi
      - name: Build wheel
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/
          # The tag must name what the library is: one architecture, the
          # macOS floor of the Go toolchain, the glibc it was built against.
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            macos-arm64)    want=macosx_13_0_arm64 ;;
            linux-x86_64)   want=manylinux2014_x86_64 ;;
            linux-arm64)    want=manylinux2014_aarch64 ;;
            windows-x86_64) want=win_amd64 ;;
          esac
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [[ "${wheels[0]}" != *"-py3-none-${want}.whl" ]]; then
            echo "::error::expected one wheel tagged py3-none-${want}, got: ${wheels[*]}"
            exit 1
          fi
      - name: Smoke-import wheel in a clean venv
        shell: bash
        run: |
          set -e
          VENV="${RUNNER_TEMP}/wheel-venv"
          python -m venv "$VENV"
          if [ "${{ runner.os }}" = "Windows" ]; then VPY="$VENV/Scripts/python.exe"; else VPY="$VENV/bin/python"; fi
          "$VPY" -m pip install --quiet dist/*.whl
          "$VPY" -c "import adbc_driver_db2, adbc_driver_db2.dbapi; print(adbc_driver_db2._driver_path())"
          # The driver manager loads the bundled library through each
          # entrypoint (default-derived, explicit, deprecated alias).
          "$VPY" -I "$GITHUB_WORKSPACE/scripts/load_entrypoints.py"
          "$VPY" -m adbc_driver_db2 install-manifest --dir "$RUNNER_TEMP/manifest"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
      - name: Stage c-shared library archive + checksum
        # The archive keeps the library's own name, libadbc_driver_db2.<ext>:
        # the driver manager derives the entrypoint (AdbcDriverDb2Init) from
        # the file name, so a platform suffix on the file would break that.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts staging
          cp "pkg/db2/libadbc_driver_db2.${{ matrix.ext }}" LICENSE NOTICE staging/
          archive="libadbc_driver_db2-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "release-artifacts/${archive}" -C staging "libadbc_driver_db2.${{ matrix.ext }}" LICENSE NOTICE
          tar -tzf "release-artifacts/${archive}"
          if command -v sha256sum >/dev/null 2>&1; then (cd release-artifacts && sha256sum "${archive}" > "${archive}.sha256");
          else (cd release-artifacts && shasum -a 256 "${archive}" > "${archive}.sha256"); fi
      - uses: actions/upload-artifact@v7
        with:
          name: libadbc_driver_db2-release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-artifacts/*

  old-glibc:
    # The Linux wheels must install and load on a glibc-2.28 distro (RHEL 8
    # family): dlopen fails on a missing GLIBC_x.y symbol version.
    name: Wheel on AlmaLinux 8 (${{ matrix.arch }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    steps:
      - uses: actions/checkout@v7
      - name: Install Python 3.12
        run: dnf install -y -q python3.12 python3.12-pip
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist
      - name: Install the wheel and load the driver
        run: |
          ldd --version | head -1
          python3.12 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q dist/*.whl
          /tmp/venv/bin/python -I scripts/load_entrypoints.py

  publish:
    name: Publish to PyPI
    needs: [wheels, old-glibc, go-integration, python-test, validation]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adbc-driver-db2
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: |
          mkdir -p dist
          find artifacts -type d -name 'wheel-*' -exec cp -r {}/. dist/ \;
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [wheels, old-glibc, go-integration, python-test, validation]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          cat release_notes.md
      - name: Stage c-shared library bundle
        run: |
          mkdir -p release-bundle
          find artifacts -type d -name 'libadbc_driver_db2-release-*' -exec cp -r {}/. release-bundle/ \;
          (cd release-bundle && sha256sum libadbc_driver_db2-*.tar.gz > SHA256SUMS)
          cat release-bundle/SHA256SUMS
          archives=(release-bundle/libadbc_driver_db2-*.tar.gz)
          if [ "${#archives[@]}" -ne 4 ]; then echo "::error::expected 4 library archives, found ${#archives[@]}"; exit 1; fi
          ls -la release-bundle/
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            release-bundle/libadbc_driver_db2-*
            release-bundle/SHA256SUMS
          generate_release_notes: true
          # Semver pre-release tags (v1.0.0-rc1, ...) get a pre-release
          # GitHub Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
